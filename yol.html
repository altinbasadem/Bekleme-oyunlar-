<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonsuz yol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{
  --bg:#e4e7ea; --panel:#d5dade; --ink:#1b2128; --dim:#5b6672; --lit:#ffb000; --litink:#2a1c00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12161c;--panel:#1a2129;--ink:#eef1f4;--dim:#8d99a6;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1a2129;--ink:#eef1f4;--dim:#8d99a6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);position:relative;overflow:hidden;
  font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none;color:#eef1f4;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#hud span{display:block;font-size:.78rem;opacity:.8}
#hud b{font-size:1.7rem;font-variant-numeric:tabular-nums}
#hud .r{text-align:right}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7rem;font-weight:700;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.7);pointer-events:none}
#ov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:color-mix(in srgb,var(--panel) 90%,transparent);
}
#ov h1{margin:0;font-size:1.9rem;line-height:1.15}
#ov p{margin:0;color:var(--dim);max-width:28ch;line-height:1.45;font-size:1.05rem}
#go{
  margin-top:6px;border:0;border-radius:999px;background:var(--lit);color:var(--litink);
  font:700 1.25rem 'Chakra Petch',system-ui,sans-serif;padding:16px 44px;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--lit) 28%,transparent);
}
#go:active{transform:scale(.96)}
#go:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.menu{color:var(--dim);font-size:1rem;padding:10px;text-decoration:underline}
.hidden{display:none!important}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bekleme">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div><span>Puan</span><b id="sc">0</b></div>
  <div class="r"><span>Rekor</span><b id="bs">0</b></div>
</div>
<div id="cd" class="hidden">2</div>
<div id="ov">
  <h1 id="ot">Sonsuz yol</h1>
  <p id="op">Ekranın sol yarısına dokun, sola geç. Sağ yarısına dokun, sağa geç. Bir aracın arkasından son anda şerit değiştirip yakından geçersen ekstra puan kazanırsın. Çarparsan oyun biter.</p>
  <button id="go">Sür</button>
    <a class="menu" href="index.html">Menüye dön</a>
</div>
<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var scEl=document.getElementById('sc'), bsEl=document.getElementById('bs'), cdEl=document.getElementById('cd');
  var ov=document.getElementById('ov'), ot=document.getElementById('ot'), op=document.getElementById('op'), go=document.getElementById('go');
  var W,H,dpr,u,roadX,roadW,py;
  var st='ready', lane=1, px=0, safe=1, cars=[], dist=0, off=0, rowGap=0, cdT=0, last=0, best=0;
  var bonus=0, trav=0, prevLane=1, travSw=-99, pops=[], needDraw=true;
  var pal=['#e4572e','#17bebb','#ffc914','#76b041','#9b5de5','#f15bb5','#4ea8de'];
  try{ best=parseInt(localStorage.getItem('sonsuz-best')||'0',10)||0; }catch(e){}
  bsEl.textContent=best;

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    roadW=Math.min(W,H*.62); u=roadW/3; roadX=(W-roadW)/2; py=H*.78; px=laneX(lane); needDraw=true;
  }
  function laneX(l){ return roadX+u*(l+.5); }
  function rr(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function reset(){
    cars=[]; dist=0; off=0; lane=1; safe=1; px=laneX(1); rowGap=u*3.2;
    bonus=0; trav=0; prevLane=1; travSw=-99; pops=[];
  }
  function spawnRow(){
    if(Math.random()<.45){ var d=Math.random()<.5?-1:1, n=safe+d; if(n<0||n>2){ n=safe-d; } safe=n; }
    if(Math.random()<.07){ return; }
    for(var l=0;l<3;l++){
      if(l!==safe && Math.random()<.8){
        var tr=Math.random()<.12;
        cars.push({l:l,y:-2.2*u,w:(tr?.56:.48)*u,h:(tr?1.55:.94)*u,c:tr?'#5b6770':pal[Math.floor(Math.random()*pal.length)],tr:tr});
      }
    }
  }
  function speed(){ return u*(3.2+3.3*(1-Math.exp(-dist/1500))); }

  function update(dt){
    var v=speed();
    dist+=v*dt/u*1.5; off=(off+v*dt)%u; trav+=v*dt;
    px+=(laneX(lane)-px)*Math.min(1,dt*18);
    rowGap-=v*dt;
    for(var i=cars.length-1;i>=0;i--){
      var cc=cars[i]; cc.y+=v*dt;
      if(!cc.p && cc.y>=py){
        cc.p=true;
        if(prevLane===cc.l && Math.abs(lane-cc.l)===1 && Math.abs(px-laneX(lane))<.3*u){
          var dd=(trav-travSw)/u, add=dd<=1.15?25:(dd<=1.8?10:0);
          if(add){ bonus+=add; pops.push({t:0,txt:'+'+add+(add===25?' çok yakın!':' yakın geçiş')}); }
        }
      }
      if(cc.y>H+2*u){ cars.splice(i,1); }
    }
    for(var q=pops.length-1;q>=0;q--){ pops[q].t+=dt; if(pops[q].t>1){ pops.splice(q,1); } }
    if(rowGap<=0){ spawnRow(); rowGap=v*Math.max(.75,1.3-dist/4000); }
    var pw=.2*u, ph=.52*u;
    for(var j=0;j<cars.length;j++){
      var c=cars[j];
      if(Math.abs(px-laneX(c.l))<(pw+c.w*.9)/2 && Math.abs(py-c.y)<(ph+c.h*.9)/2){ crash(); return; }
    }
    scEl.textContent=Math.floor(dist)+bonus;
  }

  function drawCar(c){
    var x=laneX(c.l)-c.w/2, y=c.y-c.h/2, w=c.w, h=c.h;
    rr(x+3,y+4,w,h,w*.2,'rgba(0,0,0,.35)');
    rr(x,y,w,h,w*.2,c.c);
    if(c.tr){ rr(x+w*.1,y+h*.06,w*.8,h*.62,w*.08,'rgba(255,255,255,.18)'); }
    else { rr(x+w*.14,y+h*.12,w*.72,h*.22,w*.1,'rgba(10,14,20,.75)'); rr(x+w*.16,y+h*.58,w*.68,h*.16,w*.08,'rgba(10,14,20,.6)'); }
    rr(x+w*.08,y+h-h*.09,w*.2,h*.06,2,'#ff3b30'); rr(x+w*.72,y+h-h*.09,w*.2,h*.06,2,'#ff3b30');
  }
  function drawBike(){
    var w=.2*u, h=.52*u, x=px-w/2, y=py-h/2;
    var g=ctx.createLinearGradient(0,y-u*1.2,0,y); g.addColorStop(0,'rgba(255,240,190,0)'); g.addColorStop(1,'rgba(255,240,190,.18)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(px-w*.4,y); ctx.lineTo(px-w*1.4,y-u*1.2); ctx.lineTo(px+w*1.4,y-u*1.2); ctx.lineTo(px+w*.4,y); ctx.fill();
    rr(x+2,y+3,w,h,w*.4,'rgba(0,0,0,.4)');
    rr(x,y,w,h,w*.4,'#0e1115');
    rr(x-w*.25,y+h*.3,w*1.5,h*.36,w*.45,'#ffb000');
    ctx.fillStyle='#f2f4f6'; ctx.beginPath(); ctx.arc(px,y+h*.32,w*.52,0,Math.PI*2); ctx.fill();
    rr(px-w*.12,y+h*.02,w*.24,h*.08,2,'#fff6c8');
  }
  function draw(){
    ctx.fillStyle='#222b36'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#000000'; ctx.fillRect(roadX,0,roadW,H);
    ctx.fillStyle='#3a4350';
    for(var k=-1;k<H/u+1;k++){
      var yy=k*u+off;
      ctx.fillRect(roadX-.32*u,yy,.1*u,.3*u); ctx.fillRect(roadX+roadW+.22*u,yy+.5*u,.1*u,.3*u);
    }
    ctx.fillStyle='#e9e4d0';
    ctx.fillRect(roadX,0,u*.05,H); ctx.fillRect(roadX+roadW-u*.05,0,u*.05,H);
    for(var i=-1;i<H/u+1;i++){
      var y2=i*u+off;
      ctx.fillRect(roadX+u-u*.03,y2,u*.06,u*.5); ctx.fillRect(roadX+2*u-u*.03,y2,u*.06,u*.5);
    }
    for(var j=0;j<cars.length;j++){ drawCar(cars[j]); }
    drawBike();
    for(var q=0;q<pops.length;q++){
      var pp=pops[q]; ctx.globalAlpha=1-pp.t; ctx.fillStyle='#ffb000';
      ctx.font='700 '+Math.round(u*.2)+'px Chakra Petch, system-ui, sans-serif'; ctx.textAlign='center';
      ctx.fillText(pp.txt,W/2,py-u*.9-pp.t*u*.6);
    }
    ctx.globalAlpha=1;
  }

  function frame(t){
    requestAnimationFrame(frame);
    var dt=Math.min(.05,(t-last)/1000); last=t; if(!(dt>0)){ return; }
    var live=(st==='run'||st==='count');
    if(st==='run'){ update(dt); }
    else if(st==='count'){
      cdT-=dt; cdEl.textContent=Math.max(1,Math.ceil(cdT));
      if(cdT<=0){ st='run'; cdEl.classList.add('hidden'); }
    }
    if(live||needDraw){ draw(); needDraw=false; }
  }

  function start(){
    reset(); st='run'; ov.classList.add('hidden'); cdEl.classList.add('hidden'); scEl.textContent='0';
  }
  function crash(){
    st='over'; needDraw=true;
    try{ if(navigator.vibrate){ navigator.vibrate([40,40,60]); } }catch(e){}
    var m=Math.floor(dist)+bonus, rec=m>best;
    if(rec){ best=m; bsEl.textContent=best; try{ localStorage.setItem('sonsuz-best',String(best)); }catch(e){} }
    ot.textContent='Çarptın';
    op.textContent=m+' puan. '+(rec&&m>0?'Yeni rekor!':'Rekorun: '+best+'.');
    go.textContent='Tekrar sür'; ov.classList.remove('hidden');
  }
  function pause(){ if(st==='run'||st==='count'){ st='paused'; cdEl.classList.add('hidden'); } }
  function resume(){ if(st==='paused'){ st='count'; cdT=2; cdEl.textContent='2'; cdEl.classList.remove('hidden'); } }

  document.addEventListener('visibilitychange',function(){ if(document.hidden){ pause(); } else { resume(); } });
  window.addEventListener('pagehide',pause);
  window.addEventListener('pageshow',function(){ if(!document.hidden){ resume(); } });
  window.addEventListener('blur',pause);
  window.addEventListener('focus',resume);

  function steer(d){ if(st==='run'){ var n=Math.max(0,Math.min(2,lane+d)); if(n!==lane){ prevLane=lane; travSw=trav; lane=n; } } }
  cv.addEventListener('pointerdown',function(e){ e.preventDefault(); steer(e.clientX<W/2?-1:1); });
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){ steer(-1); } else if(e.key==='ArrowRight'){ steer(1); }
  });
  go.addEventListener('click',start);
  window.addEventListener('resize',resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
